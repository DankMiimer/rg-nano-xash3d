// RG Nano controls and modest memory settings.
unbindall
bind "ESCAPE" "cancelselect"
bind "UPARROW" "+forward"
bind "DOWNARROW" "+back"
bind "LEFTARROW" "+left"
bind "RIGHTARROW" "+right"
bind "ENTER" "+use"
bind "SPACE" "+jump"
bind "e" "+reload"
bind "v" "+attack"
// R switches forward/back to pitch and turn keys to strafe.
alias "+nano_rlook" "+strafe; +klook"
alias "-nano_rlook" "-strafe; -klook"
bind "g" "+nano_rlook"
// Precise camera speed is the default; L temporarily gives fast look.
cl_yawspeed "70"
cl_pitchspeed "75"
set nano_aim_yaw "70"
set nano_aim_pitch "75"
set nano_aim_fast_multiplier "3"
alias "+nano_aim" "nano_look_fast 1; cl_yawspeed 210; cl_pitchspeed 225"
alias "-nano_aim" "nano_look_fast 0; cl_yawspeed 70; cl_pitchspeed 75"
bind "t" "+nano_aim"
nano_look_accel "1"
nano_look_fast "0"
nano_look_delay "0.15"
nano_look_ramp "0.75"
nano_look_max_yaw "210"
nano_hud_profile "1"
nano_hud_element_scale "1"
nano_hud_anchor_x "0"
nano_hud_anchor_y "0"
nano_hud_offset_x "0"
nano_hud_offset_y "0"
nano_hud_pixel_coordinates "0"
set nano_hud_radar "0.5"
set nano_hud_crosshair "2"
set nano_hud_identity "1"
bind "z" "centerview"
bind "c" "+duck"
cl_himodels "0"
cl_allowdownload "0"
cl_allowupload "0"
mp_decals "64"
r_decals "128"
hud_fontrender "0"
hud_scale_minimal_width "320"
con_fontrender "0"
touch_enable "0"
joy_enable "0"
cmd_scripting "1"
fps_max "30"
set nano_fps_limit "1"
set nano_fps_value "30"
// The software framebuffer has no VSync wait; retain the explicit frame cap.
gl_vsync "0"
set nano_frame_sleep "1"
scr_drawversion "0"
name "RG Nano"
bind "1" "+lookup"
bind "3" "+lookdown"
bind "2" "+attack2"
bind "4" "savequick"
bind "5" "loadquick"
bind "p" "impulse 100"
bind "f" "invnext"
hud_scale "1"
set nano_hud_bottom "2"
set nano_hud_side "2"
set nano_hud_menu "1"
set nano_hud_text_height "14"
set nano_ui_profile_version "3"
